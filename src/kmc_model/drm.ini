[Meta]
author = Harpreet
email = happythappa5@gmail.com
model_name = drm_simple
model_dimension = 2

[Species empty]
color = #FFFFFF
representation = ''

[Species CH3]
color = #00FF00
representation = 'CH3'

[Species H]
color = #0000FF
representation = 'H'

[Species C]
color = #FF0000
representation = 'C'

[Species CO]
color = #808080
representation = 'CO'

[Lattice]
cell_size = 20 20 10.0

[Layer simple_cubic]
site hollow = (0.5, 0.5, 0.5)

[Parameter k_CH4_ads]
value = 1.0

[Parameter k_CH3_diss]
value = 0.5

[Parameter k_H2_des]
value = 2.0

[Parameter k_C_removal]
value = 0.05

[Process CH4_adsorption]
rate_constant = k_CH4_ads
conditions = empty@hollow
actions = CH3@hollow

[Process CH3_dissociation]
rate_constant = k_CH3_diss
conditions = CH3@hollow
actions = C@hollow

[Process H2_desorption]
rate_constant = k_H2_des
conditions = H@hollow
actions = empty@hollow

[Process Carbon_removal]
rate_constant = k_C_removal
conditions = C@hollow
actions = empty@hollow
